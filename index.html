<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>AETHERIA ONLINE ローダー</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Shippori+Mincho:wght@600&display=swap" rel="stylesheet" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f3ecdd;
        --bg-deep: #e9dfc9;
        --ink: #232946;
        --ink-soft: #5a5f7d;
        --gold: #a97e2f;
        --gold-bright: #c49a3f;
        --bar-track: rgba(35, 41, 70, 0.16);
        --card-line: rgba(169, 126, 47, 0.45);
        --btn-bg: #232946;
        --btn-ink: #f5efdf;
        --danger: #a33327;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0a0e1d;
          --bg-deep: #060913;
          --ink: #ece5cf;
          --ink-soft: #9aa1bd;
          --gold: #c9a24e;
          --gold-bright: #e8c97a;
          --bar-track: rgba(236, 229, 207, 0.14);
          --card-line: rgba(201, 162, 78, 0.4);
          --btn-bg: #c9a24e;
          --btn-ink: #141021;
          --danger: #e08a7d;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(120% 90% at 50% 0%, var(--bg) 0%, var(--bg-deep) 78%);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 18px calc(24px + env(safe-area-inset-bottom));
      }
      main {
        width: 100%;
        max-width: 430px;
        text-align: center;
      }
      .crest {
        width: 54px; height: 54px;
        margin: 0 auto 18px;
        color: var(--gold);
      }
      .crest svg { width: 100%; height: 100%; display: block; }
      h1 {
        font-family: "Cinzel", "Shippori Mincho", serif;
        font-weight: 800;
        font-size: clamp(30px, 8.4vw, 42px);
        letter-spacing: 0.08em;
        line-height: 1.15;
        margin: 0;
      }
      .sub {
        font-family: "Shippori Mincho", serif;
        font-size: 14px;
        letter-spacing: 0.34em;
        text-indent: 0.34em;
        color: var(--ink-soft);
        margin: 10px 0 0;
      }
      .rule {
        display: flex; align-items: center; gap: 12px;
        margin: 26px auto 22px;
        max-width: 300px;
        color: var(--gold);
      }
      .rule::before, .rule::after {
        content: ""; flex: 1; height: 1px;
        background: linear-gradient(90deg, transparent, var(--card-line), transparent);
      }
      .rule span { font-size: 11px; }
      .bar {
        height: 6px;
        border-radius: 999px;
        background: var(--bar-track);
        overflow: hidden;
      }
      .bar > i {
        display: block; height: 100%;
        width: 0%;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--gold), var(--gold-bright));
        transition: width 0.45s ease;
      }
      #status {
        margin: 18px 0 0;
        font-size: 15px;
        line-height: 1.7;
        min-height: 3.4em;
      }
      #elapsed {
        margin: 2px 0 0;
        font-size: 12.5px;
        color: var(--ink-soft);
        font-variant-numeric: tabular-nums;
        min-height: 1.5em;
      }
      .actions {
        margin-top: 20px;
        display: none;
        flex-direction: column;
        gap: 10px;
        align-items: stretch;
      }
      .actions.show { display: flex; }
      button, .btn-link {
        min-height: 48px;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.04em;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        padding: 10px 18px;
      }
      #retryBtn {
        border: none;
        background: var(--btn-bg);
        color: var(--btn-ink);
      }
      .btn-link {
        border: 1px solid var(--card-line);
        color: var(--ink);
        background: transparent;
      }
      .error-text { color: var(--danger); }
      .foot {
        margin-top: 30px;
        font-size: 12px;
        color: var(--ink-soft);
        line-height: 1.8;
      }
      .foot a {
        color: var(--gold);
        text-decoration: underline;
        text-underline-offset: 3px;
        padding: 10px 4px;
        display: inline-block;
      }
      @media (prefers-reduced-motion: no-preference) {
        .crest { animation: pulse 2.6s ease-in-out infinite; }
        @keyframes pulse {
          0%, 100% { opacity: 0.75; transform: scale(1); }
          50% { opacity: 1; transform: scale(1.05); }
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="crest" aria-hidden="true">
        <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.4">
          <path d="M32 4 L56 26 L32 60 L8 26 Z" stroke-linejoin="round"/>
          <path d="M8 26 H56 M32 4 L22 26 L32 60 L42 26 L32 4" stroke-linejoin="round"/>
        </svg>
      </div>
      <h1>AETHERIA<br />ONLINE</h1>
      <p class="sub">エーテリア オンライン</p>

      <div class="rule" aria-hidden="true"><span>◆</span></div>

      <div class="bar" role="progressbar" aria-label="読み込み状況" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="barWrap">
        <i id="barFill"></i>
      </div>
      <p id="status">サーバーに接続しています…</p>
      <p id="elapsed"></p>

      <div class="actions" id="actions">
        <button id="retryBtn" type="button">もう一度試す</button>
        <a class="btn-link" id="directLink" href="https://aetheria-realtime-server.onrender.com/game">サーバーから直接開く</a>
      </div>

      <p class="foot">
        久しぶりのアクセスでは、サーバーの起動に<br />最大1分ほどかかることがあります。<br />
        <a href="https://aetheria-realtime-server.onrender.com/game">うまく開かないときは、こちらから直接開けます</a>
      </p>
    </main>

    <script>
      (function () {
        'use strict';
        var SERVER = 'https://aetheria-realtime-server.onrender.com';
        var statusEl = document.getElementById('status');
        var elapsedEl = document.getElementById('elapsed');
        var fillEl = document.getElementById('barFill');
        var barWrap = document.getElementById('barWrap');
        var actionsEl = document.getElementById('actions');
        var retryBtn = document.getElementById('retryBtn');

        var progress = 0;      // 表示中の進捗
        var progressCap = 8;   // 現在フェーズで進んでよい上限
        var startedAt = 0;
        var elapsedTimer = null;
        var progressTimer = null;
        var running = false;

        function setProgress(v) {
          progress = Math.max(progress, Math.min(100, v));
          fillEl.style.width = progress + '%';
          barWrap.setAttribute('aria-valuenow', String(Math.round(progress)));
        }
        function setStatus(text, isError) {
          statusEl.textContent = text;
          statusEl.className = isError ? 'error-text' : '';
        }
        function tickProgress() {
          // 上限の手前までゆっくり進む（実完了で上限が上がる）
          if (progress < progressCap) setProgress(progress + Math.max(0.4, (progressCap - progress) * 0.06));
        }
        function tickElapsed() {
          var sec = Math.floor((Date.now() - startedAt) / 1000);
          elapsedEl.textContent = sec >= 3 ? '待機中 ' + sec + ' 秒' : '';
          if (sec >= 8 && progressCap <= 45) {
            setStatus('サーバーが起動中です。そのままお待ちください…');
          }
        }
        function fetchWithTimeout(url, ms) {
          var ctrl = new AbortController();
          var t = setTimeout(function () { ctrl.abort(); }, ms);
          return fetch(url, { cache: 'no-store', signal: ctrl.signal, credentials: 'omit' })
            .then(function (r) { clearTimeout(t); return r; }, function (e) { clearTimeout(t); throw e; });
        }
        function wait(ms) { return new Promise(function (res) { setTimeout(res, ms); }); }

        function fail(kind) {
          running = false;
          clearInterval(elapsedTimer);
          clearInterval(progressTimer);
          elapsedEl.textContent = '';
          if (kind === 'nogame') {
            setStatus('ゲーム本体がサーバーで見つかりませんでした。サーバー側の準備が整うと、ここからそのまま遊べます。', true);
          } else {
            setStatus('サーバーに接続できませんでした。通信環境を確認して、もう一度お試しください。', true);
          }
          actionsEl.classList.add('show');
        }

        function inject(html) {
          setProgress(100);
          setStatus('起動しています…');
          clearInterval(elapsedTimer);
          clearInterval(progressTimer);
          // いまの文書をゲーム本体で置き換える。以後の表示・操作はすべて本体側。
          setTimeout(function () {
            document.open();
            document.write(html);
            document.close();
          }, 250);
        }

        function loadGame() {
          progressCap = 88;
          setStatus('サーバーが応答しました。ゲーム本体を読み込んでいます…');
          var url = SERVER + '/game?v=' + Date.now();
          return fetchWithTimeout(url, 90000).then(function (res) {
            if (res.status === 404 || res.status === 503) { fail('nogame'); return null; }
            if (!res.ok) { fail('network'); return null; }
            return res.text();
          }).then(function (html) {
            if (html === null) return;
            if (!/<html[\s>]/i.test(html) && !/<!doctype/i.test(html)) { fail('nogame'); return; }
            inject(html);
          }).catch(function () { fail('network'); });
        }

        function wake(attempt) {
          // /health が返るまでがスリープ復帰待ち。リクエスト自体が起床トリガーになる。
          var url = SERVER + '/health?t=' + Date.now();
          return fetchWithTimeout(url, 80000).then(function (res) {
            if (!res.ok) throw new Error('bad status');
            return res.json();
          }).then(function () {
            progressCap = 70;
            setProgress(62);
            return loadGame();
          }).catch(function () {
            if (!running) return;
            if (Date.now() - startedAt > 150000) { fail('network'); return; }
            setStatus('サーバーが起動中です。そのままお待ちください…');
            return wait(4000).then(function () { if (running) return wake(attempt + 1); });
          });
        }

        function start() {
          if (running) return;
          running = true;
          actionsEl.classList.remove('show');
          progress = 0;
          progressCap = 45;
          setProgress(6);
          setStatus('サーバーに接続しています…');
          elapsedEl.textContent = '';
          startedAt = Date.now();
          clearInterval(elapsedTimer);
          clearInterval(progressTimer);
          elapsedTimer = setInterval(tickElapsed, 500);
          progressTimer = setInterval(tickProgress, 200);
          wake(0);
        }

        retryBtn.addEventListener('click', start);
        start();
      })();
    </script>
  </body>
</html>
